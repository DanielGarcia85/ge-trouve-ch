<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>Architecture de Ge-Trouve : chaîne en ligne et chaîne d'indexation hors ligne</title>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="av" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker>
  </defs>

  <!-- ── En ligne ─────────────────────────────────────────── -->
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1D4ED8">EN LIGNE, À CHAQUE QUESTION</text>

  <rect x="20" y="48" width="120" height="96" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="80" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Usager</text>
  <text x="80" y="110" text-anchor="middle" font-size="13.5" fill="#64748B">navigateur</text>

  <rect x="176" y="48" width="140" height="96" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="246" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">Caddy</text>
  <text x="246" y="110" text-anchor="middle" font-size="13.5" fill="#1E3A8A">HTTPS, proxy</text>

  <rect x="352" y="48" width="140" height="96" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="2"/>
  <text x="422" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">Streamlit</text>
  <text x="422" y="110" text-anchor="middle" font-size="13.5" fill="#14532D">interface</text>

  <rect x="528" y="40" width="452" height="112" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  <text x="544" y="62" font-size="14" font-weight="700" fill="#334155">Pipeline Haystack</text>
  <rect x="544" y="74" width="132" height="64" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
  <text x="610" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">1. Encodage</text>
  <text x="610" y="121" text-anchor="middle" font-size="12.5" fill="#475569">Qwen3-Embedding</text>
  <rect x="690" y="74" width="132" height="64" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="756" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">2. Recherche</text>
  <text x="756" y="121" text-anchor="middle" font-size="12.5" fill="#92400E">Chroma, 5 fragments</text>
  <rect x="836" y="74" width="132" height="64" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
  <text x="902" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">3. Génération</text>
  <text x="902" y="121" text-anchor="middle" font-size="12.5" fill="#475569">Gemma 4 12B</text>

  <line x1="140" y1="84" x2="170" y2="84" stroke="#475569" stroke-width="2.2" marker-end="url(#ag)"/>
  <line x1="316" y1="84" x2="346" y2="84" stroke="#475569" stroke-width="2.2" marker-end="url(#ag)"/>
  <line x1="492" y1="84" x2="522" y2="84" stroke="#475569" stroke-width="2.2" marker-end="url(#ag)"/>
  <line x1="676" y1="106" x2="684" y2="106" stroke="#475569" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="822" y1="106" x2="830" y2="106" stroke="#475569" stroke-width="2" marker-end="url(#ag)"/>

  <!-- retour de la réponse -->
  <path d="M902,152 V182 H80 V150" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#av)"/>
  <text x="491" y="200" text-anchor="middle" font-size="13.5" fill="#065F46">réponse en français simple, avec les liens des pages officielles</text>

  <!-- ── Hors ligne ───────────────────────────────────────── -->
  <line x1="20" y1="226" x2="980" y2="226" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="20" y="256" font-size="15" font-weight="700" fill="#B45309">HORS LIGNE, EN AMONT (INDEXATION)</text>

  <rect x="20" y="276" width="160" height="96" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="100" y="314" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">Manifeste</text>
  <text x="100" y="336" text-anchor="middle" font-size="13" fill="#64748B">4 322 pages ge.ch</text>
  <text x="100" y="354" text-anchor="middle" font-size="13" fill="#64748B">et geneve.ch</text>

  <rect x="214" y="276" width="160" height="96" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="294" y="314" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">Scraping</text>
  <text x="294" y="336" text-anchor="middle" font-size="13" fill="#64748B">robots.txt respecté,</text>
  <text x="294" y="354" text-anchor="middle" font-size="13" fill="#64748B">2 s entre requêtes</text>

  <rect x="408" y="276" width="160" height="96" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="488" y="314" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">Découpage</text>
  <text x="488" y="336" text-anchor="middle" font-size="13" fill="#64748B">fragments de 200 mots,</text>
  <text x="488" y="354" text-anchor="middle" font-size="13" fill="#64748B">avec métadonnées</text>

  <rect x="602" y="276" width="160" height="96" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="682" y="314" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">Embeddings</text>
  <text x="682" y="336" text-anchor="middle" font-size="13" fill="#64748B">Qwen3-Embedding,</text>
  <text x="682" y="354" text-anchor="middle" font-size="13" fill="#64748B">1 024 dimensions</text>

  <rect x="796" y="276" width="184" height="96" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="888" y="314" text-anchor="middle" font-size="15.5" font-weight="700" fill="#92400E">Base Chroma</text>
  <text x="888" y="336" text-anchor="middle" font-size="13" fill="#92400E">9 651 fragments,</text>
  <text x="888" y="354" text-anchor="middle" font-size="13" fill="#92400E">environ 191 Mo</text>

  <line x1="180" y1="324" x2="208" y2="324" stroke="#475569" stroke-width="2.2" marker-end="url(#ag)"/>
  <line x1="374" y1="324" x2="402" y2="324" stroke="#475569" stroke-width="2.2" marker-end="url(#ag)"/>
  <line x1="568" y1="324" x2="596" y2="324" stroke="#475569" stroke-width="2.2" marker-end="url(#ag)"/>
  <line x1="762" y1="324" x2="790" y2="324" stroke="#475569" stroke-width="2.2" marker-end="url(#ag)"/>

  <!-- la base est lue par la recherche -->
  <path d="M830,276 V246 H756 V146" fill="none" stroke="#B45309" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="764" y="240" font-size="12.5" fill="#B45309">lue à chaque question</text>
</svg>
