<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="pg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="16" fill="#334155">Chaque note se mesure à un endroit différent du flux : deux jugent la recherche, deux jugent la génération.</text>

  <!-- Étage recherche -->
  <rect x="20" y="56" width="492" height="256" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
  <text x="266" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">Étage recherche</text>
  <text x="266" y="104" text-anchor="middle" font-size="13.5" fill="#1E3A8A">a-t-on ramené les bons fragments ?</text>

  <!-- Étage génération -->
  <rect x="530" y="56" width="450" height="256" rx="16" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.6"/>
  <text x="755" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">Étage génération</text>
  <text x="755" y="104" text-anchor="middle" font-size="13.5" fill="#78350F">la réponse est-elle bien construite ?</text>

  <!-- Rappel (2, violet) -->
  <circle cx="52" cy="132" r="11" fill="#7C3AED"/>
  <text x="52" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="70" y="137" font-size="15" font-weight="700" fill="#6D28D9">Rappel du contexte</text>
  <text x="70" y="157" font-size="13.5" fill="#5B21B6">la réponse de référence est-elle</text>
  <text x="70" y="175" font-size="13.5" fill="#5B21B6">couverte par les fragments ?</text>
  <text x="70" y="194" font-size="12.5" font-style="italic" fill="#7C3AED">seule métrique à utiliser la référence</text>
  <line x1="252" y1="176" x2="344" y2="200" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- Référence -->
  <rect x="350" y="116" width="140" height="52" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/>
  <text x="420" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Réponse de</text>
  <text x="420" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">référence</text>
  <line x1="420" y1="168" x2="420" y2="204" stroke="#475569" stroke-width="2.2" marker-end="url(#pg)"/>

  <!-- Flux -->
  <rect x="38" y="210" width="132" height="62" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="104" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Question</text>
  <text x="104" y="256" text-anchor="middle" font-size="13" fill="#475569">de l'usager</text>

  <line x1="170" y1="241" x2="196" y2="241" stroke="#475569" stroke-width="2.4" marker-end="url(#pg)"/>

  <rect x="202" y="210" width="138" height="62" rx="9" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="271" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">Recherche</text>
  <text x="271" y="256" text-anchor="middle" font-size="13" fill="#1E3A8A">des fragments</text>

  <line x1="340" y1="241" x2="366" y2="241" stroke="#475569" stroke-width="2.4" marker-end="url(#pg)"/>

  <rect x="372" y="210" width="128" height="62" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="436" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Fragments</text>
  <text x="436" y="256" text-anchor="middle" font-size="13" fill="#475569">remontés</text>

  <line x1="500" y1="241" x2="552" y2="241" stroke="#475569" stroke-width="2.4" marker-end="url(#pg)"/>

  <rect x="558" y="210" width="150" height="62" rx="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="633" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">Génération</text>
  <text x="633" y="256" text-anchor="middle" font-size="13" fill="#78350F">par Gemma</text>

  <line x1="708" y1="241" x2="734" y2="241" stroke="#475569" stroke-width="2.4" marker-end="url(#pg)"/>

  <rect x="740" y="210" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="815" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Réponse</text>
  <text x="815" y="256" text-anchor="middle" font-size="13" fill="#475569">produite</text>

  <!-- Précision (1, bleu) -->
  <line x1="436" y1="272" x2="436" y2="316" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="304" cy="334" r="11" fill="#1D4ED8"/>
  <text x="304" y="339" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="322" y="339" font-size="15" font-weight="700" fill="#1D4ED8">Précision du contexte</text>
  <text x="322" y="359" font-size="13.5" fill="#1E3A8A">les fragments sont-ils utiles,</text>
  <text x="322" y="377" font-size="13.5" fill="#1E3A8A">et les bons en tête de liste ?</text>

  <!-- Fidélité (3, orange) : arc Fragments -> Réponse -->
  <path d="M470,276 C560,336 700,336 788,276" stroke="#EA580C" stroke-width="2.2" fill="none"/>
  <circle cx="470" cy="276" r="4" fill="#EA580C"/>
  <circle cx="788" cy="276" r="4" fill="#EA580C"/>
  <circle cx="600" cy="356" r="11" fill="#EA580C"/>
  <text x="600" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="618" y="361" font-size="15" font-weight="700" fill="#C2410C">Fidélité</text>
  <text x="618" y="381" font-size="13.5" fill="#9A3412">la réponse est-elle étayée</text>
  <text x="618" y="399" font-size="13.5" fill="#9A3412">par les fragments ?</text>

  <!-- Pertinence (4, vert) : arc Question <-> Réponse -->
  <path d="M104,276 C230,600 790,600 848,276" stroke="#047857" stroke-width="2.2" fill="none"/>
  <circle cx="104" cy="276" r="4" fill="#047857"/>
  <circle cx="848" cy="276" r="4" fill="#047857"/>
  <circle cx="272" cy="412" r="11" fill="#047857"/>
  <text x="272" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
  <text x="290" y="417" font-size="15" font-weight="700" fill="#047857">Pertinence de la réponse</text>
  <text x="290" y="437" font-size="13.5" fill="#065F46">la réponse vise-t-elle la question posée ?</text>
  <text x="290" y="456" font-size="12.5" font-style="italic" fill="#059669">seule métrique à utiliser l'encodeur (Qwen)</text>
</svg>
