<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker>
    <marker id="mo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="mv" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
  </defs>

  <rect x="20" y="20" width="960" height="620" rx="16" fill="#FDFEFF" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="44" y="52" font-size="15" fill="#475569">Poste de développement : tout en local (Ollama), aucun service externe</text>

  <!-- 1. Le banc -->
  <rect x="50" y="80" width="330" height="204" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.2"/>
  <text x="215" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#1D4ED8">1. Production : le système évalué</text>
  <text x="215" y="138" text-anchor="middle" font-size="14.5" fill="#1E3A8A">Haystack, le pipeline figé</text>
  <rect x="66" y="152" width="180" height="54" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="156" y="174" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1D4ED8">Pipeline</text>
  <text x="156" y="194" text-anchor="middle" font-size="13" fill="#1E3A8A">src/repondre.py</text>
  <path d="M276,160 v22" stroke="#F59E0B" stroke-width="1.8" fill="none"/>
  <path d="M356,160 v22" stroke="#F59E0B" stroke-width="1.8" fill="none"/>
  <ellipse cx="316" cy="182" rx="40" ry="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <rect x="276" y="160" width="80" height="22" fill="#FEF3C7"/>
  <ellipse cx="316" cy="160" rx="40" ry="9" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="316" y="216" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400E">Base Chroma</text>
  <text x="215" y="258" text-anchor="middle" font-size="14" fill="#1E3A8A">répond aux 20 questions, une passe chacune</text>

  <!-- Traces -->
  <rect x="486" y="92" width="42" height="50" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/>
  <path d="M470,102 h29 l12,12 v36 h-41 z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/>
  <path d="M499,102 l12,12 h-12 z" fill="#E2E8F0" stroke="#64748B" stroke-width="1.4"/>
  <text x="489" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">{ }</text>
  <text x="500" y="180" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">Traces</text>
  <text x="500" y="201" text-anchor="middle" font-size="13.5" fill="#475569">question, fragments, réponse</text>

  <line x1="382" y1="130" x2="456" y2="130" stroke="#475569" stroke-width="2.4" marker-end="url(#mg)"/>
  <line x1="544" y1="130" x2="614" y2="130" stroke="#475569" stroke-width="2.4" marker-end="url(#mg)"/>
  <text x="579" y="113" text-anchor="middle" font-size="13.5" fill="#475569">rejouées</text>

  <!-- 2. La notation -->
  <rect x="620" y="80" width="330" height="170" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.2"/>
  <text x="785" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#92400E">2. Évaluation : l'instrument</text>
  <text x="785" y="146" text-anchor="middle" font-size="16.5" font-weight="700" fill="#B45309">RAGAS 0.4.3</text>
  <text x="785" y="170" text-anchor="middle" font-size="13.5" fill="#78350F">les quatre métriques du Tableau 7.2</text>
  <text x="785" y="206" text-anchor="middle" font-size="14" fill="#78350F">lit les traces, ne modifie rien au système</text>
  

  <!-- Chaîne de dépendance à droite -->
  <line x1="785" y1="288" x2="785" y2="254" stroke="#B45309" stroke-width="2.2" marker-end="url(#mo)"/>
  <text x="772" y="274" text-anchor="end" font-size="13.5" fill="#92400E">fournit le juge et l'encodeur</text>

  <rect x="620" y="290" width="330" height="100" rx="12" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="785" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">LangChain</text>
  <text x="785" y="344" text-anchor="middle" font-size="13.5" fill="#78350F">adaptateurs ChatOllama et OllamaEmbeddings</text>
  <text x="785" y="366" text-anchor="middle" font-size="13.5" fill="#B45309">dépendance interne de RAGAS, pas de Ge-Trouve</text>

  <line x1="785" y1="416" x2="785" y2="394" stroke="#B45309" stroke-width="2.2" marker-end="url(#mo)"/>
  <text x="798" y="408" font-size="13.5" fill="#92400E">sert Llama et Qwen</text>

  <!-- Descente production -->
  <line x1="215" y1="414" x2="215" y2="288" stroke="#1D4ED8" stroke-width="2.2" marker-end="url(#mb)"/>
  <text x="228" y="330" font-size="13.5" fill="#1D4ED8">sert Gemma et Qwen</text>

  <!-- Barre Ollama -->
  <rect x="50" y="418" width="900" height="62" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2"/>
  <text x="500" y="456" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Ollama : le serveur d'inférence local</text>

  <line x1="215" y1="516" x2="215" y2="484" stroke="#1D4ED8" stroke-width="2.2" marker-end="url(#mb)"/>
  <line x1="500" y1="516" x2="500" y2="484" stroke="#059669" stroke-width="2.2" marker-end="url(#mv)"/>
  <line x1="785" y1="516" x2="785" y2="484" stroke="#B45309" stroke-width="2.2" marker-end="url(#mo)"/>

  <!-- Modèles -->
  <rect x="70" y="518" width="290" height="94" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="215" y="554" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">Gemma 4 12B</text>
  <text x="215" y="580" text-anchor="middle" font-size="14" fill="#1E3A8A">le rédacteur (production)</text>

  <rect x="390" y="518" width="220" height="94" rx="12" fill="#F0FDF4" stroke="#059669" stroke-width="2"/>
  <text x="500" y="550" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">Qwen3-Embedding-0.6B</text>
  <text x="500" y="574" text-anchor="middle" font-size="14" fill="#14532D">les embeddings,</text>
  <text x="500" y="594" text-anchor="middle" font-size="14" fill="#14532D">partagés par les deux chaînes</text>

  <rect x="640" y="518" width="290" height="94" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="785" y="550" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">Llama 3.1 8B</text>
  <text x="785" y="574" text-anchor="middle" font-size="14" fill="#78350F">le juge de l'évaluation,</text>
  <text x="785" y="594" text-anchor="middle" font-size="14" fill="#78350F">d'une autre famille que le rédacteur</text>
</svg>
