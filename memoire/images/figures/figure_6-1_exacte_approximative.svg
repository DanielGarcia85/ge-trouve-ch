<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Calibri, Arial, sans-serif">

  <!-- ===== Titres des deux volets ===== -->
  <text x="250" y="42" font-size="19" font-weight="bold" text-anchor="middle" fill="#000000">Recherche exacte</text>
  <text x="750" y="42" font-size="19" font-weight="bold" text-anchor="middle" fill="#000000">Recherche approximative (HNSW)</text>

  <!-- ===== Volet gauche : exacte ===== -->
  <rect x="30" y="60" width="440" height="330" rx="8" fill="#F7F7F7" stroke="#808080" stroke-width="1.5"/>
  <circle cx="250" cy="92" r="9" fill="#C9A227"/>
  <text x="264" y="97" font-size="14" fill="#404040">question</text>

  <!-- grille : tous les vecteurs visités (sombres) -->
  <g fill="#2E5496">
    <circle cx="70" cy="130" r="7"/><circle cx="142" cy="130" r="7"/><circle cx="214" cy="130" r="7"/><circle cx="286" cy="130" r="7"/><circle cx="358" cy="130" r="7"/><circle cx="430" cy="130" r="7"/>
    <circle cx="70" cy="185" r="7"/><circle cx="142" cy="185" r="7"/><circle cx="214" cy="185" r="7"/><circle cx="286" cy="185" r="7"/><circle cx="358" cy="185" r="7"/><circle cx="430" cy="185" r="7"/>
    <circle cx="70" cy="240" r="7"/><circle cx="142" cy="240" r="7"/><circle cx="214" cy="240" r="7"/><circle cx="286" cy="240" r="7"/><circle cx="358" cy="240" r="7"/><circle cx="430" cy="240" r="7"/>
    <circle cx="70" cy="295" r="7"/><circle cx="142" cy="295" r="7"/><circle cx="214" cy="295" r="7"/><circle cx="286" cy="295" r="7"/><circle cx="358" cy="295" r="7"/><circle cx="430" cy="295" r="7"/>
    <circle cx="70" cy="345" r="7"/><circle cx="142" cy="345" r="7"/><circle cx="214" cy="345" r="7"/><circle cx="286" cy="345" r="7"/><circle cx="358" cy="345" r="7"/><circle cx="430" cy="345" r="7"/>
  </g>
  <circle cx="358" cy="295" r="12" fill="none" stroke="#C00000" stroke-width="2.5"/>
  <text x="452" y="380" font-size="13" text-anchor="end" fill="#595959">30/30 visités</text>

  <!-- ===== Volet droit : approximative ===== -->
  <rect x="530" y="60" width="440" height="330" rx="8" fill="#F7F7F7" stroke="#808080" stroke-width="1.5"/>
  <circle cx="750" cy="92" r="9" fill="#C9A227"/>
  <text x="764" y="97" font-size="14" fill="#404040">question</text>

  <!-- grille : la plupart non visités (pâles) -->
  <g fill="#D9D9D9">
    <circle cx="570" cy="130" r="7"/><circle cx="642" cy="130" r="7"/><circle cx="714" cy="130" r="7"/><circle cx="786" cy="130" r="7"/><circle cx="858" cy="130" r="7"/><circle cx="930" cy="130" r="7"/>
    <circle cx="570" cy="185" r="7"/><circle cx="642" cy="185" r="7"/><circle cx="858" cy="185" r="7"/><circle cx="930" cy="185" r="7"/>
    <circle cx="570" cy="240" r="7"/><circle cx="714" cy="240" r="7"/><circle cx="858" cy="240" r="7"/><circle cx="930" cy="240" r="7"/>
    <circle cx="570" cy="295" r="7"/><circle cx="642" cy="295" r="7"/><circle cx="714" cy="295" r="7"/><circle cx="930" cy="295" r="7"/>
    <circle cx="570" cy="345" r="7"/><circle cx="642" cy="345" r="7"/><circle cx="714" cy="345" r="7"/><circle cx="786" cy="345" r="7"/><circle cx="858" cy="345" r="7"/><circle cx="930" cy="345" r="7"/>
  </g>
  <!-- chemin visité : sombres + flèches vertes -->
  <g fill="#2E5496">
    <circle cx="714" cy="130" r="7"/>
    <circle cx="786" cy="185" r="7"/>
    <circle cx="714" cy="240" r="7"/>
    <circle cx="786" cy="295" r="7"/>
    <circle cx="858" cy="295" r="7"/>
  </g>
  <g stroke="#538135" stroke-width="2.5" fill="none">
    <polyline points="750,101 718,121"/>
    <polyline points="720,136 780,179"/>
    <polyline points="780,191 720,234"/>
    <polyline points="720,246 780,289"/>
    <polyline points="793,295 849,295"/>
  </g>
  <g fill="#538135">
    <polygon points="722,118 714,130 728,126"/>
    <polygon points="776,174 786,185 782,170"/>
    <polygon points="726,230 714,240 730,240"/>
    <polygon points="776,284 786,295 782,280"/>
    <polygon points="847,289 858,295 847,301"/>
  </g>
  <circle cx="858" cy="295" r="12" fill="none" stroke="#C00000" stroke-width="2.5"/>
  <text x="952" y="380" font-size="13" text-anchor="end" fill="#595959">6/30 visités</text>

  <!-- ===== Légendes sous les volets ===== -->
  <text x="250" y="420" font-size="14" text-anchor="middle" fill="#404040">compare la question à tous les vecteurs, puis trie</text>
  <text x="250" y="442" font-size="13" text-anchor="middle" fill="#595959">résultat garanti ; coût proportionnel à la taille</text>
  <text x="750" y="420" font-size="14" text-anchor="middle" fill="#404040">un graphe mène, de proche en proche, à une petite fraction</text>
  <text x="750" y="442" font-size="13" text-anchor="middle" fill="#595959">quasi exact ; quelques sauts, même à très grande échelle</text>

  <!-- ===== Pastille Ge-Trouve ===== -->
  <rect x="150" y="470" width="700" height="52" rx="12" fill="#E2EFDA" stroke="#538135" stroke-width="2.5"/>
  <text x="500" y="502" font-size="16" font-weight="bold" text-anchor="middle" fill="#385723">Sous dix mille fragments, la recherche exacte suffit : le cas de Ge-Trouve.</text>

</svg>
